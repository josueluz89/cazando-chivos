name: vigilancia-chivos

# 2 veces por dia: 9am y 6pm Costa Rica (UTC-6) + manual. Gratis (Actions free tier).
on:
  schedule:
    - cron: "0 15 * * *"
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Revisar fuentes
        run: python vigilancia/check.py --run
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
      - name: Guardar estado y candidatos
        run: |
          git config user.name "chivos-bot"
          git config user.email "chivos-bot@users.noreply.github.com"
          git add -A vigilancia/ || true
          if [ -d logos-bares ]; then git add -A logos-bares || true; fi
          git diff --cached --quiet && echo "sin cambios" || git commit -m "chore: vigilancia $(date -u +%Y%m%d-%H%M)"
          git push || true
      - name: Abrir issue si hay novedades
        run: |
          gh label create vigilancia --color C82024 --description "Novedades de la vigilancia automatica" 2>/dev/null || true
          N=$(python -c "import json;print(len(json.load(open('vigilancia/novedades.json'))['novedades']))")
          if [ "$N" != "0" ]; then
            STAMP=$(python -c "import json;print(json.load(open('vigilancia/novedades.json'))['stamp'])")
            gh issue create --title "Vigilancia $STAMP: $N novedades" \
              --label vigilancia --body-file vigilancia/issue_body.md || true
          else
            echo "sin novedades, sin issue"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
